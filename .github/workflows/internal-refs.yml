# Refuse to publish internal references to a public repository.
#
# This fork and upstream are both PUBLIC. Internal tracker ids, agent
# identities and host paths have already reached upstream's permanent history.
# This job is the mechanical gate that stops it recurring — it runs on every
# push and PR regardless of who or what authored the commit, which is the only
# reason it also covers commits pushed by Paperclip agents.
#
# Matching is by shape, never by name: a denylist enumerating internal company
# names, committed to a public repo, would publish the inventory it protects.
# Literal names live in a private wordlist outside the tree.

name: internal-refs

on:
  pull_request:
  push:
    branches: [main, prerelease]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history: the scan reads commit messages, not just the tree.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Scan changed content for internal references
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          node scripts/check-internal-refs.mjs --range "$BASE..HEAD"
